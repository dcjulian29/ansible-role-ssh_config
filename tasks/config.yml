---
- name: "{{ 'Determine the ' + item.user + ' user home directory' }}"
  ansible.builtin.stat:
    path: "~"
  register: home
  become: true
  become_user: "{{ item.user }}"

- name: "Ensure .ssh directories exist for {{ item.user }}"
  ansible.builtin.file:
    group: "{{ home.stat.gid }}"
    mode: "0700"
    owner: "{{ home.stat.uid }}"
    path: "{{ home.stat.path }}/{{ item }}"
    state: directory
  with_items:
    - .ssh
    - .ssh/conf.d

- name: "Ensure SSH include directory is used for {{ item.user }}"
  ansible.builtin.lineinfile:
    create: true
    dest: "{{ home.stat.path }}/.ssh/config"
    group: "{{ home.stat.gid }}"
    line: "Include ~/.ssh/conf.d/*"
    mode: "0644"
    owner: "{{ home.stat.uid }}"
    regexp: "^Include ~/.ssh/conf.d/*"
    state: present

- name: "{{ 'Creating local SSH config files for ' + item.user + ' and ' + item.host }}"
  ansible.builtin.template:
    dest: "{{ home.stat.path }}/.ssh/conf.d/{{ item.host }}"
    group: "{{ home.stat.gid }}"
    mode: "0644"
    owner: "{{ home.stat.uid }}"
    src: templates/ssh_config.j2
